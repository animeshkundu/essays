name: Publish latest essay

# Merges the newest open essay pull request every morning at 8:53 AM Pacific, then deploys Pages.
# When no eligible essay PR is open it does nothing and succeeds, so a day without a new essay
# publishes nothing rather than failing.
#
# This lives in the site repo, not essays-engine, because the merge needs pull-requests: write on
# THIS repo and the built-in GITHUB_TOKEN already has it. main carries a ruleset that blocks direct
# pushes, force-pushes and deletion, but lets this PR merge through: no required review, no status
# checks, no merge queue. No PAT and no deploy key are involved.
#
# Eligibility is deliberately narrow. The PR's head branch must live in THIS repo, the PR must be
# authored by the owner or by this repo's own workflow token, it must not be a draft, and it must
# change exactly one file — the essay. A fork can name its branch essay/<date>-<slug>, but a fork PR
# has isCrossRepository=true and is never eligible. Every condition is re-read immediately before
# the merge, and the merge is pinned to the head commit that was checked.
#
# deploy.yml is dispatched explicitly because a merge performed with GITHUB_TOKEN does not start
# workflows: GitHub suppresses runs from events caused by that token (workflow_dispatch and
# repository_dispatch are the only exemptions). The merge push to main therefore never fires
# deploy.yml on its own.
#
# The merge is a rebase merge so main receives the essay's own commit as authored by the engine,
# not a github-actions[bot] squash commit.

on:
  schedule:
    # 8:53 AM Pacific, timezone-aware so DST does not shift it. Off the top of the hour on purpose:
    # GitHub's scheduler is congested there and delays or drops runs.
    - cron: "53 8 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report which PR would be published and merge nothing."
        required: false
        default: "false"

permissions:
  contents: write       # merge the PR branch into main
  pull-requests: write  # list and merge the PR
  actions: write        # dispatch deploy.yml

concurrency:
  group: publish-latest-essay
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Only the owner or the scheduler may run this
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          # Unconditional and first: a fork that kept this file must fail here, even on a schedule.
          if [ "$GITHUB_REPOSITORY" != "animeshkundu/essays" ]; then
            echo "::error::not the canonical repository"; exit 1
          fi
          if [ "$EVENT" = "schedule" ]; then exit 0; fi
          ACTOR="${TRIGGERING_ACTOR:-$ACTOR}"
          if [ "$ACTOR" != "animeshkundu" ]; then
            echo "::error::only animeshkundu may dispatch this workflow (actor: $ACTOR)"; exit 1
          fi

      - name: Pick the newest open essay PR
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Newest first, restricted to same-repo PRs opened by the owner or by this repo's own
          # workflow token (gh renders that token's author as app/github-actions). Any other PR open
          # against main is left alone. `== false` rather than `| not` so a missing field fails
          # closed.
          PICK="$(gh pr list --repo "$REPO" --state open --base main --limit 1000 \
            --json number,createdAt,headRefName,headRefOid,isCrossRepository,isDraft,author,headRepositoryOwner \
            --jq '[.[] | select(.isCrossRepository == false)
                       | select(.headRepositoryOwner.login == "animeshkundu")
                       | select(.author.login == "animeshkundu"
                                or .author.login == "app/github-actions"
                                or .author.login == "github-actions[bot]")
                       | select(.isDraft == false)
                       | select(.headRefName | test("^essay/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$"))]
                  | sort_by(.createdAt) | reverse
                  | (.[0] // empty) | "\(.number) \(.headRefName) \(.headRefOid)"')"
          if [ -z "$PICK" ]; then
            echo "No open essay PR; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r NUMBER BRANCH HEAD_OID <<< "$PICK"
          # Re-validate what came back before it reaches a gh command.
          case "$NUMBER" in
            ''|*[!0-9]*) echo "::error::unexpected PR number: $NUMBER"; exit 1 ;;
          esac
          if ! printf '%s' "$BRANCH" | grep -qE '^essay/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$'; then
            echo "::error::unexpected head branch: $BRANCH"; exit 1
          fi
          if ! printf '%s' "$HEAD_OID" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::unexpected head commit: $HEAD_OID"; exit 1
          fi
          TITLE="$(gh pr view "$NUMBER" --repo "$REPO" --json title --jq .title)"
          echo "Newest open essay PR: #$NUMBER — $TITLE ($BRANCH @ $HEAD_OID)"
          # Multiline-safe: a PR title is free text and must not be able to inject other outputs.
          {
            echo "found=true"
            echo "number=$NUMBER"
            echo "branch=$BRANCH"
            echo "head_oid=$HEAD_OID"
            echo "title<<TITLE_EOF"
            printf '%s\n' "$TITLE"
            echo "TITLE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Re-check the PR immediately before merging
        if: ${{ steps.pick.outputs.found == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pick.outputs.number }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          HEAD_OID: ${{ steps.pick.outputs.head_oid }}
        run: |
          set -euo pipefail
          # Re-read every eligibility condition immediately before the merge. The head commit must
          # still be the one picked, so a force-push between pick and merge is refused rather than
          # merged. Exactly one changed file, and it must be the essay: a workflow edit cannot ride
          # along. gh's --json files returns at most 100 entries, so >100 changes can never pass
          # the "exactly one" test.
          CHECK="$(gh pr view "$NUMBER" --repo "$REPO" \
            --json isCrossRepository,isDraft,headRefName,headRefOid,author,files \
            --jq '[.isCrossRepository, .isDraft, .headRefName, .headRefOid, .author.login,
                   (.files | length), (.files[0].path // "")] | @tsv')"
          IFS=$'\t' read -r IS_FORK IS_DRAFT REF OID AUTHOR NFILES FILE0 <<< "$CHECK"
          fail() { echo "::error::PR #$NUMBER no longer matches the publish criteria: $1"; exit 1; }
          [ "$IS_FORK" = "false" ] || fail "head branch is in another repository"
          [ "$IS_DRAFT" = "false" ] || fail "PR is a draft"
          [ "$REF" = "$BRANCH" ] || fail "head branch is now $REF"
          [ "$OID" = "$HEAD_OID" ] || fail "head commit is now $OID"
          case "$AUTHOR" in
            animeshkundu|app/github-actions|'github-actions[bot]') ;;
            *) fail "author is $AUTHOR" ;;
          esac
          [ "$NFILES" = "1" ] || fail "PR changes $NFILES files"
          printf '%s' "$FILE0" \
            | grep -qE '^src/content/essays/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+[.]mdx$' \
            || fail "changed file is $FILE0"
          echo "Re-check passed: #$NUMBER ($BRANCH @ $HEAD_OID), one file: $FILE0"

      - name: Merge it
        if: ${{ steps.pick.outputs.found == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pick.outputs.number }}
          TITLE: ${{ steps.pick.outputs.title }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          HEAD_OID: ${{ steps.pick.outputs.head_oid }}
        run: |
          set -euo pipefail
          # --match-head-commit closes the last gap: if the branch moves after the re-check, the
          # merge fails instead of merging content nobody verified.
          gh pr merge "$NUMBER" --repo "$REPO" --rebase --match-head-commit "$HEAD_OID"
          STATE="$(gh pr view "$NUMBER" --repo "$REPO" --json state --jq .state)"
          if [ "$STATE" != "MERGED" ]; then
            echo "::error::PR #$NUMBER is $STATE after the merge attempt"
            exit 1
          fi
          echo "Merged #$NUMBER into main."
          {
            echo "### Published"
            echo ""
            echo "PR #$NUMBER — $TITLE (\`$BRANCH\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Pages for the new main
        if: ${{ steps.pick.outputs.found == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BEFORE="$(gh run list --repo "$REPO" --workflow deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run deploy.yml --repo "$REPO" --ref main
          RUN_ID=""
          for _ in $(seq 1 20); do
            LATEST="$(gh run list --repo "$REPO" --workflow deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$LATEST" -gt "$BEFORE" ] 2>/dev/null; then RUN_ID="$LATEST"; break; fi
            sleep 3
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::the deploy run did not appear"
            exit 1
          fi
          echo "Deploy run: https://github.com/$REPO/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 10

      - name: Report a dry run
        if: ${{ steps.pick.outputs.found == 'true' && github.event.inputs.dry_run == 'true' }}
        env:
          NUMBER: ${{ steps.pick.outputs.number }}
          TITLE: ${{ steps.pick.outputs.title }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          echo "Dry run: would merge #$NUMBER — $TITLE ($BRANCH) and deploy."
