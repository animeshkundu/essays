name: Open essay PR

# The engine repo pushes a finished essay as branch essay/<YYYY-MM-DD-slug>. This workflow reacts to that
# push and opens a pull request against main using the built-in GITHUB_TOKEN, so no cross-repo token is
# needed. Merging the PR triggers deploy.yml, which publishes to Pages. The ref name is set by GitHub and
# is validated to the exact essay/<date>-<slug> shape; anything else exits cleanly and opens nothing.
# All derived values are passed via env and never inlined as ${{ }} into the shell.

on:
  push:
    branches:
      - "essay/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          DELETED: ${{ github.event.deleted }}
        run: |
          set -euo pipefail

          # A push event also fires on branch DELETION (e.g. after a PR is merged and the branch removed).
          # That carries no head to open a PR against, so skip it.
          if [ "${DELETED:-}" = "true" ]; then
            echo "Branch deletion event; nothing to do."
            exit 0
          fi

          # Validate the branch shape, then derive a clean slug from it.
          if ! printf '%s' "$BRANCH" | grep -qE '^essay/[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$'; then
            echo "Branch '$BRANCH' is not an essay branch; nothing to do."
            exit 0
          fi
          SLUG="${BRANCH#essay/}"
          SLUG="${SLUG#????-??-??-}"

          # Idempotent: if a PR for this branch is already open, do nothing.
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH; nothing to do."
            exit 0
          fi

          # Title and body are built only from the validated slug (a shell variable, not a workflow
          # expression), so no untrusted text reaches the command; gh reads GH_TOKEN from the env.
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Essay: $SLUG" \
            --body "Draft essay for review. Merge to publish (this triggers the Pages deploy)."
          echo "Opened PR for $BRANCH."
